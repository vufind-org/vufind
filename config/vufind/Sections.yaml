# Sections are specific configurable parts of the user interface. Sections include
# navigation menus, which have their own configuration files, and other types of
# user interface elements.
#
# All sections must have a 'plugin' key specifying the section plugin to use. Values
# can be class names or aliases defined in the service manager configuration.
#
# Additional section keys are determined by the service. All section specific
# configuration is passed to the service. Key names beginning with a double
# underscore (e.g. __key) are reserved for internal section service use.

Sections:
  AccountMenu:
    plugin: accountMenu

  AdminMenu:
    plugin: adminMenu
