; This configuration file is used for the German "Gemeinsamer Verbündeindex" (GVI),
; a Solr index for interlibrary loan.
; The search is accessible under /GVI URLs within VuFind.
;
; It can be used in combination with Combined Search (see Combined.ini) to create
; a tabbed interface searching multiple indexes.
;
; Most of the settings found in searches.ini and facets.ini can be dropped into
; this file and will behave the same way. Some selected settings from config.ini
; that apply only to the main Solr index are also overridden here. To ease
; maintenance of documentation, comments from those files are not duplicated here.
; See those files for more details of how all settings work. Look for section
; marker comments within this file to see where groups of settings come from.

; ---------- config.ini settings ----------

[Index]
url             = http://gvi.bsz-bw.de/solr
default_core    = GVI
maxBooleanClauses = 1024
timeout = 30
default_dismax_handler = dismax

[IndexHttp]

[Spelling]
enabled = true
limit   = 3
phrase = false
expand  = true
simple = false
skip_numeric = true

[Record]
; Field in Solr that contains the MARC-XML
marc_field = fullrecord
next_prev_navigation = false
related[] = Similar

[RecordDrivers]
; Map your custom recordtype to the SolrMarc driver
GviMarcDE604 = SolrMarc

; ---------- searches.ini settings ----------

[General]
default_handler = AllFields
default_sort = relevance
default_view = list
default_limit = 20
;limit_options        = 10,20,40,60,80,100
case_sensitive_bools = true
case_sensitive_ranges = true

default_top_recommend[] = TopFacets:ResultsTop:GVI
default_top_recommend[] = SpellingSuggestions
;default_top_recommend[] = VisualFacets:Visual_Settings
default_side_recommend[] = SideFacets:Results:CheckboxFacets:GVI
;default_noresults_recommend[] = SwitchTab
default_noresults_recommend[] = SwitchType
default_noresults_recommend[] = SwitchQuery:::fuzzy
default_noresults_recommend[] = SpellingSuggestions
default_noresults_recommend[] = RemoveFilters

highlighting = true
;highlighting_fields = *
snippets = true
retain_filters_by_default = true
always_display_reset_filters = false
;default_filters[] = "format:Book"
;default_filters[] = "institution:MyInstitution"
;default_filters[] = "(format:Book AND institution:MyInstitution)"
;default_record_fields = "*,score"
display_versions = true
load_results_with_js = true
;top_paginator = simple

[Cache]
type = File

[Basic_Searches]
AllFields           = "All Fields"
Title               = Title
;JournalTitle        = "Journal Title"
Author              = Author
Subject             = Subject
ISN                 = "ISBN/ISSN"
;Coordinate        = Coordinates
;tag                 = Tag

[Advanced_Searches]
AllFields           = adv_search_all
Title               = adv_search_title
;JournalTitle        = adv_search_journaltitle
Author              = adv_search_author
Subject             = adv_search_subject
ISN                 = adv_search_isn
publisher           = adv_search_publisher
Series              = adv_search_series
year                = adv_search_year
toc                 = adv_search_toc
;Coordinate        = Coordinates

[Sorting]
relevance = sort_relevance
year = sort_year
year asc = sort_year_asc
author = sort_author
title = sort_title

[HiddenSorting]
;pattern[] = .*

[DefaultSortingByType]
CallNumber = callnumber-sort
WorkKeys = year

[SideRecommendations]
;Subject[]          = SideFacets
;Subject[]          = OpenLibrarySubjectsDeferred:lookfor:5:true:topic,place,person,time

[TopRecommendations]
Author[]            = AuthorFacets
Author[]            = SpellingSuggestions
CallNumber[]        = "TopFacets:ResultsTop"
WorkKeys[]          = false

[NoResultsRecommendations]
CallNumber[] = SwitchQuery::wildcard:truncatechar
CallNumber[] = RemoveFilters
;CallNumber[] = AlphaBrowseLink:lcc

[RSS]
sort = "last_indexed desc"

[Autocomplete]
enabled = true
default_handler = GVI
formatting_rule[*] = "phrase"
formatting_rule[tag] = "none"

[Autocomplete_Types]
Title = "GVI:Title"
JournalTitle = "GVI:JournalTitle"
Author = "GVI:Author:author,author2"
Subject = "GVI:Subject:topic,genre,geographic,era"
CallNumber = "GVICN"
ISN = "GVI:ISN:isbn,issn"
Coordinate = "None"
tag = "Tag"

[Snippet_Captions]
author2 = "Other Authors"
contents = "Table of Contents"
topic = "Subjects"
container_title = "Journal Title"

;[IndexShards]
;Library Catalog = localhost:8983/solr/biblio
;Website = localhost:8983/solr/website

;[ShardPreferences]
;showCheckboxes = true
;defaultChecked[] = "Library Catalog"
;defaultChecked[] = "Website"

[StripFields]

;[Views]
;list = List
;grid = Grid
;visual = Visual

[List]
view=full

[HiddenFilters]
;institution = "MyInstitution"

[RawHiddenFilters]
;0 = "format:\"Book\" OR format:\"Journal\""
;1 = "language:\"English\" OR language:\"French\""

[ConditionalHiddenFilters]
;0 = "-conditionalFilter.MyUniversity|format:Book"
;1 = "conditionalFilter.MyUniversity|format:Article"

[Records]
;deduplication = true
;sources = alli,testsrc

[MoreLikeThis]
; GVI requires useMoreLikeThisHandler = true and useQtParam = true.
useMoreLikeThisHandler = true
; Fall back to qt=morelikethis via /select (for legacy Solr).
useQtParam = true
; GVI does not support title, title_short, callnumber-label, publishDateRange.
;params = "qf=title,title_short,callnumber-label,topic,language,author,publishDateRange mintf=1 mindf=1";
params = "qf=title,language,author mintf=1 mindf=1";
;count = 5

[HomePage]
;content[] = IlsStatusMonitor
content[] = FacetList:GVI

[API]
;recordAccessPermission = access.api.Record
;searchAccessPermission = access.api.Search
;maxLimit = 100

[SearchCache]
;adapter = Memcached
;options[servers] = "localhost:11211,otherhost:11211"
;options[ttl] = 300
;options[cache_dir] = "/tmp/search-cache"

[Explain]
;enabled = true
;minPercent = 0
;maxFields = -1
;decimalPlaces = 2

; ---------- facets.ini settings ----------

[Results]
;institution        = Institution
;building           = Library
material_content_type = adv_search_mediatype
material_access    = adv_search_access_type
consortium         = adv_search_network
ill_flag           = adv_search_ill
;hierarchy_top_title   = Collections
author_facet       = Author
language           = Language
;genre_facet        = Genre
;era_facet          = Era
;geographic_facet   = Region
publishDateRange   = "adv_search_year"

[ResultsTop]
;topic_facet        = "Suggested Topics"

[FacetLabels]
labelSections[] = Advanced_Facets
labelSections[] = HomePage_Facets
labelSections[] = ResultsTop
labelSections[] = Results
labelSections[] = ExtraFacetLabels
checkboxSections[] = CheckboxFacets

[ExtraFacetLabels]
long_lat = "Geographic Search"

[SpecialFacets]
dateRange[] = publishDate
dateRange[] = publishDateRange
;fullDateRange[] = example_field_date
;numericRange[] = example_field_str
;genericRange[] = example_field_str
;hierarchical[] = building
;hierarchicalFacetSortOptions[building] = top
;hierarchicalFacetDisplayStyles[format] = full
;hierarchicalFacetSeparators[format] = " > "

[CheckboxFacets]
;edition:1st* = "First Edition"

[Results_Settings]
facet_limit = 30
showMore[*] = 6
showMoreInLightbox[*] = more
;lightboxLimit = 50
top_rows = 2
;exclude = *
;orFacets = *
;collapsedFacets = *
;sorted_by_index[] = building;
;sorted_by_index[] = institution;

; Enable JS feature to select multiple facets without reloading the result page
; Possible values :
; false (default) => behaviour disabled
; true (deprecated, use unchecked) => behaviour enabled, unchecked by default, user preference is persistent
; unchecked => behaviour enabled, unchecked by default, user preference is persistent
; checked => behaviour enabled, checked by default, user preference is persistent
; always => behaviour enabled, the feature is always on no matter user choice
;multiFacetsSelection = unchecked

[Advanced_Facets]
language              = Language
material_content_type = adv_search_mediatype
material_access       = adv_search_access_type
consortium            = adv_search_network
ill_flag              = adv_search_ill
;hierarchy_top_title   = Collections

[Advanced_Settings]
facet_limit      = 100
orFacets = *
delimiter = "{{{_:::_}}}"
special_facets   = "illustrated,daterange"
;translated_facets[] = institution
;translated_facets[] = building
;translated_facets[] = format
;translated_facets[] = callnumber-first:CallNumberFirst
translated_facets[] = consortium:GVIConsortium
translated_facets[] = language:ISO639-3
translated_facets[] = material_content_type
translated_facets[] = material_access
translated_facets[] = ill_flag:GVIILLFlag
;delimited_facets[] = author_id_str
;delimited_facets[] = "author_id_str|:::"

[HomePage_Facets]
language              = Language
material_content_type = adv_search_mediatype
material_access       = adv_search_access_type
consortium            = adv_search_network
ill_flag              = adv_search_ill
;hierarchy_top_title   = Collections

[HomePage_Facet_Settings]
facet_limit      = 20

[LegacyFields]

[HideFacetValue]
;format[] = "Book"

[ILL]
; Comma-separated list of ISIL numbers for the home institution.
; Records with holdings at these ISILs are excluded from ILL.
local_isils = ""

; Base URL for the interlibrary loan form.
ill_base_url = "https://www2.bib.uni-mannheim.de/cgi-bin/fernleihe/index.pl"

[Facet_publishDateRange]
;slider_min_value = "1400"
;slider_max_value = "+1 year"
