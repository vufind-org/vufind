; Tooltips
tooltip_tabs_eds_html = ""
tooltip_tabs_l1_html = "<h4>Educational resources</h4><p>In this tab you will find educational resources. Use the filters for learning to facilitate your search.</p>"
tooltip_tabs_local_html = ""
tooltip_tabs_pci_html = ""
tooltip_tabs_summon_html = ""
tooltip_facet_html = ""
tooltip_blended_search_html = "<h4>Search from all collections</h4><p>Search using title, author, subject or other keywords related to your topic of interest. You can use <strong>Finnish</strong> or <strong>English</strong> keywords.<p>Keyword truncating is possible with * (asterisk), for example neuro*.</p><p->Search terms can be combined with boolean operators <strong>AND, OR, NOT</strong>.</p><p>For exact search use quotation marks around your keyword.</p>"
tooltip_local_search_html = "<h4>Search from library/museum/archive collections</h4><p>Search using title, author, subject or other keywords related to your topic of interest. </p><p>The search finds different forms of Finnish-language search terms. Words in other languages can be truncated with an asterisk, for example, neuro*.</p><p>Search terms can be combined with Boolean operators <strong>AND, OR or NOT</strong>.</p><p>For exact search use quotation marks around your keyword.</p><p><a href='/Content/help-basic'>Read more about search techniques.</a></p>"
tooltip_eds_search_html = ""
tooltip_pci_search_html = ""
tooltip_summon_search_html = ""
tooltip_myaccount_html = "<h4>Your Account</h4><p>Manage your user information and library cards on the Profile and Library cards pages, respectively.</p><p>You will find information about your loans, reservations and possible fines in their respective sections.</p><p>You can change your favourites as well as your most recent saved searches on the Favourites and Saved searches pages.</p>"
tooltip_blended_advanced_html = "<h4>Advanced search in all collections</h4><p>On the Advanced Search page, you can type keywords, clauses and search operators in several search fields.</p><p>In the drop-down menu beside each search field, you can select which fields of the record the terms should be searched in. The default is <strong>all fields</strong>.</p><p>You can narrow down your search to match with the <strong>title</strong>, <strong>author</strong>, <strong>subject</strong> or <strong>abstract</strong>.</p><p>The search provides results that match with the contents of all search fields.</p><p>You can add more search fields by clicking on the <strong>Add search field</strong> button.</p><p><a href='../Content/help-advanced'>More search tips</a></p>"
tooltip_local_advanced_html = ""
tooltip_eds_advanced_html = ""
tooltip_pci_advanced_html = "<h4>Advanced Search in International E-resources</h4><p>On the Advanced Search page, you can type keywords and clauses in several search fields.</p><p>In the first drop-down menu, you can select how you want to combine the search terms on the row. You can choose to search records that match with <strong>all terms on the row</strong>, <strong>any terms on the row</strong> or <strong>the exact phrase</strong>.</p><p>In the second drop-down menu of the row, you can select which fields of the record the terms should be searched in. The default is <strong>all fields</strong>. You can narrow down your search to match with the <strong>title</strong>, <strong>author</strong>, <strong>subject</strong>, <strong>abstract</strong> or <strong>ISSN</strong>.</p><p>The rows are combined with the operator <strong>AND</strong> providing search results that match with the search criteria of all rows.</p><p>You can add more rows by clicking the <strong>Add search field</strong> button.</p>"
tooltip_summon_advanced_html = ""
tooltip_tabs_combined_html = ""
tooltip_library_card_name_html = "<h4>Library card name (optional)</h4> You can name your library card for easier distinction. Name is shown on library card dropdowns, if you have connected more than one card in your account. If name field is left empty, username of library card is shown instead."

