organisation_usage_rights_0/arc/_html = "<p>Största delen av arkivens material kan man läsa på plats i arkiven. Forskare, studenter och andra kan ansöka om tillstånd att använda material med begränsad tillgång för forskningsändamål. I de flesta fall beviljas tillståndet.</p><p>Alla arkiv som medverkar i Finna har överfört material som är fritt tillgängligt på nätet.</p>"
organisation_usage_rights_0/mus/_html = "<p>I Finna får du tillgång till material på nätet som inte visas i museet och som t.ex. bara forskare har haft tillgång till tidigare.</p><p>Många museer erbjuder en möjlighet att ansöka om rätt att mot betalning använda bilder eller beställa bilder som kan tryckas.</p>"
organisation_usage_rights_1/lib/pub/_html = "<p>Vem som helst får låna böcker och annat material i de allmänna biblioteken i Finland. För att få ett lånekort kan det krävas att man har en adress i Finland.</p>"
organisation_usage_rights_1/lib/spl/_html = "<p>I de flesta specialbiblioteken får vem som helst låna material.</p><p>Man behöver inte alltid ett nytt kort för att få rätt att låna material i ett bibliotek, i vissa fall kan man lägga till lånerätten till det kort som kunden redan använder. Lånerätten beviljas oftast av bibliotekens kundtjänst.</p>"
organisation_usage_rights_1/lib/uni/_html = "<p>I de flesta universitets- och yrkeshögskolebiblioteken får vem som helst låna material.</p><p>Man behöver inte alltid ett nytt kort för att få rätt att låna material i ett bibliotek, i vissa fall kan man lägga till lånerätten till det kort som kunden redan använder. Lånerätten beviljas oftast av bibliotekens kundtjänst.</p>"
