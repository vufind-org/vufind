; Tooltips
tooltip_tabs_eds_html = ""
tooltip_tabs_l1_html = "<h4>Lärresurser</h4><p>I denna flik hittar du olika lärresurser. Du kan använda sökfiltren för lärande.</p>"
tooltip_tabs_local_html = ""
tooltip_tabs_pci_html = ""
tooltip_tabs_summon_html = ""
tooltip_facet_html = ""
tooltip_blended_search_html = ""
tooltip_eds_search_html = ""
tooltip_local_search_html = "<h4>Sök i bibliotekets/museets/arkivets samlingar</h4><p>Skriv verkets namn, skapare, ämne eller andra relaterade sökord i sökrutan.<p>Sökningen hittar de olika formerna av finska sökord. Ord på andra språk kan du trunkera med en asterisk, till exempel neuro*.</p><p>Kombinera sökord med de Booleska operatorerna <strong>AND, OR och NOT</strong>.</p><p>Du kan söka med en exakt fras genom att använda sökord inom citattecken.</p><p><a href='/Content/help-basic'>Läs mera om sökteknik</a></p>"
tooltip_pci_search_html = ""
tooltip_summon_search_html = ""
tooltip_myaccount_html = "<h4>Mitt konto</h4><p>Hantera dina användaruppgifter och bibliotekskort på undersidorna Min profil och Bibliotekskort.</p><p>Dina lån, reservationer och eventuella betalningar finns på separata undersidor.</p><p>Favoriter som du valt samt dina senaste och sparade sökningar kan redigeras på undersidorna Favoriter och Sparade sökningar.</p>"
tooltip_blended_advanced_html = "<h4>Avancerad sökning i alla samlingar</h4><p>På sidan för avancerad sökning kan du skriva in söktermer, sökfraser och sökoperatorer i flera olika fält.</p><p>I rullgardinsmenyn intill varje sökfält kan du välja vilket fält i posten sökningen ska riktas till. Standardinställningen är <strong>alla fält</strong>.</p><p>Du kan precisera din sökning så den riktar sig till <strong>titel</strong>/<strong>rubrik</strong>, <strong>författare</strong>, <strong>ämne</strong> eller <strong>abstrakt</strong>/<strong>beskrivning</strong>.</p><p>Resultaten av sökningen är sådana poster som överensstämmer med innehållet i alla sökfält.</p><p><strong>Lägg till ett sökfält</strong> kan användas för att lägga till ett nytt sökfält till blanketten</p><p><a href='../Content/help-advanced'>Närmare anvisningar för sökning</a></p>"
tooltip_eds_advanced_html = ""
tooltip_local_advanced_html = ""
tooltip_pci_advanced_html = "<h4>Avancerad sökning i internationellt e-material</h4><p>Vid avancerad sökning kan du skriva sökord och sökmeningar i flera olika sökfält.</p><p>Välj i den första rullgardinsmenyn på raden hur du vill kombinera orden på samma rad. Du kan välja att söka poster som motsvarar <strong>alla sökord på raden</strong>, <strong>vilket som helst av sökorden på raden</strong> eller <strong>hela den fras som sökorden bildar</strong>.</p><p>I den andra rullgardinsmenyn på raden kan du välja vilket fält i posten sökningen ska riktas till. Standardinställningen är <strong>Alla träffar</strong>. Du kan precisera din sökning så att den riktar sig till <strong>rubrik</strong>, <strong>författare</strong>, <strong>ämne</strong>, <strong>abstrakt</strong> tai <strong>ISSN</strong>-kod.</p><p>Raderna förenas med <strong>AND</strong>-operatorer, det vill säga att resultatet av sökningen är sådana poster som överensstämmer med sökvillkoren på alla rader. </p><p><strong>Lägg till ett sökfält</strong> kan användas för att lägga till flera rader.</p>"
tooltip_summon_advanced_html = ""
tooltip_tabs_combined_html = ""
tooltip_library_card_name_html = "<h4>Bibliotekskortsnamn (valfri)</h4> Du kan namnge ditt bibliotekskort. Namnet visas i rullgardinsmenyn, när du har anslutit flera bibliotekskort. Om du lämnar namnet tomt, visas bibliotekskortsbeteckningen."

