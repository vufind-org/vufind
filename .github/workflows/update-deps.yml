name: Dependabot Update Vendor Files

on:
  pull_request:
    branches: [dev]  # match VuFind's actual default/dev branch

permissions:
  contents: write

jobs:
  update-vendor:
    if: >
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      contains(github.event.pull_request.labels.*.name, 'javascript')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Update vendor files
        run: VUFIND_HOME=$PWD npm run check:dependencySync

      - name: Commit updated vendor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update vendor files via updateDeps"
          git push
