    <script>
			// format date and time ranges
			const rangeFormatter = new Intl.DateTimeFormat("default", {
			  month: "long",
			  day: "numeric",
			  hour: "numeric",
			  minute: "numeric",
				timeZoneName: "short",
			});
			for (const el of document.querySelectorAll("[data-gmt-range]")) {
				const parts = el.dataset.gmtRange.split("/");
				const startDate = Date.parse(parts[0]);
				const endDate = Date.parse(parts[1]);
				el.textContent = rangeFormatter.formatRange(startDate, endDate);
			}

			// hide after
			const now = new Date().toISOString();
			for (const el of document.querySelectorAll("[data-hide-after]")) {
				const after = new Date(Date.parse(el.dataset.hideAfter)).toISOString();
				if (after < now) {
					el.classList.add("hidden");
				}
			}
    </script>
