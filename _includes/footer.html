<form id="theme-form" popover="hint">
  <h2>Site Appearance</h2>

  <fieldset>
    <legend>Theme</legend>

    <label for="site-theme-system">
      <input type="radio" id="site-theme-system" name="site-theme" value="light dark" />
      <span class="theme-system">System</span>
    </label>

    <label for="site-theme-light">
      <input type="radio" id="site-theme-light" name="site-theme" value="light" />
      <span class="theme-light">Light</span>
    </label>

    <label for="site-theme-dark">
      <input type="radio" id="site-theme-dark" name="site-theme" value="dark" />
      <span class="theme-dark">Dark</span>
    </label>
  </fieldset>

  <fieldset>
    <legend>Font</legend>

    <label for="site-font-system">
      <input type="radio" id="site-font-system" name="site-font" value="system" />
      <span class="font-system">System</span>
    </label>

    <label for="site-font-serif">
      <input type="radio" id="site-font-serif" name="site-font" value="serif" />
      <span class="font-serif">Serif</span>
    </label>

    <label for="site-font-monospace">
      <input type="radio" id="site-font-monospace" name="site-font" value="monospace" />
      <span class="font-monospace">Monospace</span>
    </label>

    <label for="site-font-lexend">
      <input type="radio" id="site-font-lexend" name="site-font" value="lexend" />
      <span class="font-lexend">Lexend</span>
    </label>
  </fieldset>

  <input type="submit" value="Save" popovertarget="theme-form" popovertargetaction="hide">
</form>

<button id="theme-picker" popovertarget="theme-form" popovertargetaction="toggle">Site Appearance</button>

<script type="module" src="{{ site.baseurl }}/assets/js/site-preferences.js"></script>
