Institutions:
  Example Institution:
    Information:
      name: Example Institution Name
      address: Example Institution address
      postal: Example Institution postal
      city: Example Institution city
      email: Example Institution email
    Lists:
      - Identifier: list_with_email
        Enabled: true
        Recipient:
          - name: name_of_the_recipient_1
            email: email_of_the_recipient_1
          - name: name_of_the_recipient_2
            email: email_of_the_recipient_2
        Datasources:
          - datasource_1
          - datasource_2
        Information:
          Address: teststreet 10
          Postal: 000001
          City: Test city
        Forms:
          PlaceOrder: default
        LibraryCardSources:
          - connection_established_to_use_lists
        Connection:
          type: email
          Sender:
            name: sender_test
            email: sender_email@email.fi
          Subject: Reservation List
      - Identifier: list_with_disec
        Enabled: true
        Datasources:
          - datasource_1
          - datasource_2
        Information:
          Address: teststreet 10
          Postal: 000001
          City: Test city
        Forms:
          PlaceOrder: default
        LibraryCardSources:
          - connection_established_to_use_lists
        Connection:
          type: disec
          base_url: "http://disectest.url.fi/"
          secret: verysecretphrase
      - Identifier: list_not_enabled
        Enabled: false
        Datasources:
          - datasource_1
          - datasource_2
        Information:
          Address: teststreet 10
          Postal: 000001
          City: Test city
        Forms:
          PlaceOrder: default
        LibraryCardSources:
          - connection_established_to_use_lists
        Connection:
          type: disec
          base_url: "http://disectest.url.fi/"
          secret: verysecretphrase
      - Identifier: list_insufficient_data
        Enabled: false
        Recipient:
          - name: name_of_the_recipient_1
            email: email_of_the_recipient_1
          - name: name_of_the_recipient_2
            email: email_of_the_recipient_2
        Datasources:
          - datasource_1
          - datasource_2
        Forms:
          PlaceOrder: default
        LibraryCardSources:
          - connection_established_to_use_lists
        Connection:
          type: email
          Sender:
            name: Service sender
            email: test@noreply.fi
          Subject: Reservation List
Forms:
  PlaceOrder:
    default:
      allowLocalOverride: false
      title: ReservationList::Send the hold request
      enabled: true
      onlyForLoggedUsers: true
      emailSubject: ReservationList::form_email_subject
      response: ReservationList::form_response
      hideSenderInfo: true
      hideRecipientInfo: true
      senderNameRequired: true
      includePatronId: true
      help:
        pre: ReservationList::request_pre_info_html
        post: ReservationList::request_post_info_html

      fields:
        - name: record_ids_text
          type: textarea
          label: ReservationList::Reservation resources
          settings:
            - [rows, 3]
            - [readonly, true]
        - name: firstName
          type: text
          label: First Name
          required: true
        - name: lastName
          type: text
          label: Last Name
          required: true
        - name: email
          type: email
          label: Email
        - name: phone
          type: text
          label: Phone
        - name: pickup_date
          type: date
          label: ReservationList::Delivery time request
          minValue: now + 2 days
          maxValue: now + 1 year
          required: true
        - name: message
          type: textarea
          label: Message
          settings:
            - [rows, 3]
    single:
      extends: default
      formActionRoute: reservationlist-placesingleorder
